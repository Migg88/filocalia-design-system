<!-- @dsCard group="Components" viewport="700x260" name="Actions" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;box-sizing:border-box}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=Object.values(window).find(v=>v&&typeof v==="object"&&v.Button&&v.Card)||{};
const I=({n,s=18})=><i data-lucide={n} style={{width:s,height:s,strokeWidth:1.5}}></i>;
const Row=({children,gap=12,style})=><div style={{display:"flex",flexWrap:"wrap",gap,alignItems:"center",...style}}>{children}</div>;
function App(){const {Button,IconButton}=NS;return <div style={{display:"flex",flexDirection:"column",gap:18}}>
<Row><Button>Enrol now</Button><Button variant="secondary">Save for later</Button><Button variant="accent" icon={<I n="calendar"/>}>Book a seat</Button><Button variant="outline">See dates</Button><Button variant="ghost">Cancel</Button></Row>
<Row><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg">Large</Button><Button disabled>Disabled</Button></Row>
<Row><IconButton label="Favourite" variant="solid" icon={<I n="heart"/>}/><IconButton label="Share" variant="soft" icon={<I n="share-2"/>}/><IconButton label="Calendar" variant="outline" icon={<I n="calendar"/>}/><IconButton label="More" icon={<I n="more-horizontal"/>}/></Row></div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
setTimeout(()=>window.lucide&&lucide.createIcons(),50);
</script></body></html>
