<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Status colours map to the brand palette" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;background:var(--status-info-bg);border-radius:var(--radius-sm);padding:16px;display:flex;gap:12px;align-items:center"><span style="width:14px;height:14px;transform:rotate(45deg);background:var(--status-info);border:1.5px solid var(--plum)"></span><div><div style="font-size:15px;font-weight:500">Info</div><div class="l">plum / blush soft</div></div></div><div style="flex:1;background:var(--status-highlight-bg);border-radius:var(--radius-sm);padding:16px;display:flex;gap:12px;align-items:center"><span style="width:14px;height:14px;transform:rotate(45deg);background:var(--status-highlight);border:1.5px solid var(--plum)"></span><div><div style="font-size:15px;font-weight:500">Success / highlight</div><div class="l">champagne</div></div></div><div style="flex:1;background:var(--status-error-bg);border-radius:var(--radius-sm);padding:16px;display:flex;gap:12px;align-items:center"><span style="width:14px;height:14px;transform:rotate(45deg);background:var(--status-error);border:1.5px solid var(--plum)"></span><div><div style="font-size:15px;font-weight:500">Error</div><div class="l">deep coral</div></div></div></div></body></html>
