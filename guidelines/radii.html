<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:18px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:76px;border-radius:var(--radius-xs);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">xs</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:76px;border-radius:var(--radius-sm);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">sm</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:76px;border-radius:var(--radius-md);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">md</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:76px;border-radius:var(--radius-lg);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">lg</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:76px;border-radius:var(--radius-pill);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">pill</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:100px;border-radius:var(--radius-arch);background:var(--nude-raised);border:1.5px solid var(--plum)"></div><span class="l">arch</span></div></div></body></html>
