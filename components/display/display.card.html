<style>body{padding:24px;box-sizing:border-box}</style></head><body><div id="root"></div>

<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
<Card arch interactive media={ph} eyebrow="Makeup · 6 wks" title="Bridal foundations" footer={<><Badge tone="champagne">Madrid</Badge><Button size="sm">Enrol</Button></>}/>
<Card interactive media={ph} eyebrow="Nails" title="Gel sculpting" footer={<Badge tone="coral" dot>3 seats</Badge>}>Two weekends, kit included.</Card>
