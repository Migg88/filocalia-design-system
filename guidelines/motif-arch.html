<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:24px;align-items:flex-end"><div style="width:120px;height:150px;border-radius:var(--radius-arch);background:repeating-linear-gradient(135deg,var(--nude-sunken) 0 8px,var(--nude-raised) 8px 16px);border:1.5px solid var(--plum);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box" class="l">photo</div><div style="width:120px;height:150px;border-radius:var(--radius-arch);background:var(--blush)"></div><div style="display:flex;flex-direction:column;gap:14px;align-items:center"><span style="width:14px;height:14px;transform:rotate(45deg);background:var(--champagne);border:1.5px solid var(--plum)"></span><span class="l">keystone</span></div><div style="flex:1;font-size:14px;line-height:1.6;color:var(--text-secondary)">Arch frames hold people and featured courses. The champagne keystone diamond marks “active”, “selected” and list bullets — always small, never more than one cluster per view.</div></div></body></html>
